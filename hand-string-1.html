<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hand String</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: monospace;
  }
  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  #video {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.4;
    transform: scaleX(-1);
  }
  #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
  }
  #status {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #0ff;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 10;
    text-shadow: 0 0 10px #0ff;
    pointer-events: none;
  }
  #startBtn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: transparent;
    border: 1px solid #0ff;
    color: #0ff;
    padding: 14px 32px;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 20;
    box-shadow: 0 0 20px #0ff4, inset 0 0 20px #0ff1;
    transition: all 0.3s;
  }
  #startBtn:hover { background: #0ff2; }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
</div>
<div id="status">Initializing...</div>
<button id="startBtn">TAP TO START</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

// Resize canvas
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Fingertip landmark indices
const FINGERTIPS = [4, 8, 12, 16, 20];
const COLORS = ['#ff003c', '#ff6600', '#00ffcc', '#0088ff', '#cc00ff'];

// Spring physics nodes
let nodes = [];

class Node {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.tx = x;
    this.ty = y;
    this.vx = 0;
    this.vy = 0;
    this.color = color;
  }
  update() {
    const stiffness = 0.18;
    const damping = 0.75;
    let ax = (this.tx - this.x) * stiffness;
    let ay = (this.ty - this.y) * stiffness;
    this.vx = (this.vx + ax) * damping;
    this.vy = (this.vy + ay) * damping;
    this.x += this.vx;
    this.y += this.vy;
  }
}

// Init 5 nodes
for (let i = 0; i < 5; i++) {
  nodes.push(new Node(
    canvas.width / 2 + (i - 2) * 60,
    canvas.height / 2,
    COLORS[i]
  ));
}

let handsDetected = false;
let animFrame;

function drawStrings() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Update nodes
  nodes.forEach(n => n.update());

  if (nodes.length < 2) return;

  // Draw glow strings between all fingertips
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i];
      const b = nodes[j];

      // Outer glow
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = a.color + '33';
      ctx.lineWidth = 10;
      ctx.shadowBlur = 30;
      ctx.shadowColor = a.color;
      ctx.stroke();

      // Inner string
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = `rgba(255,255,255,0.85)`;
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#fff';
      ctx.stroke();
    }
  }

  // Draw fingertip dots
  nodes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.shadowBlur = 25;
    ctx.shadowColor = n.color;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(n.x, n.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#fff';
    ctx.fill();
  });

  ctx.shadowBlur = 0;
  animFrame = requestAnimationFrame(drawStrings);
}

function onResults(results) {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    handsDetected = true;
    status.textContent = '✦ HAND DETECTED';

    const landmarks = results.multiHandLandmarks[0];
    FINGERTIPS.forEach((tipIdx, i) => {
      const lm = landmarks[tipIdx];
      // Mirror X because video is mirrored
      nodes[i].tx = lm.x * canvas.width;
      nodes[i].ty = lm.y * canvas.height;
    });
  } else {
    handsDetected = false;
    status.textContent = 'SHOW YOUR HAND';
  }
}

async function startCamera() {
  startBtn.style.display = 'none';
  status.textContent = 'Starting camera...';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();
    status.textContent = 'Loading hand tracker...';

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    // Manual frame loop instead of Camera utility
    async function processFrame() {
      try {
        await hands.send({ image: video });
      } catch (e) {}
      requestAnimationFrame(processFrame);
    }

    video.addEventListener('loadeddata', () => {
      status.textContent = 'SHOW YOUR HAND';
      drawStrings();
      processFrame();
    });

  } catch (err) {
    status.textContent = 'Camera error: ' + err.message;
    startBtn.style.display = 'block';
    startBtn.textContent = 'RETRY';
    console.error(err);
  }
}

startBtn.addEventListener('click', startCamera);
</script>
</body>
</html>
