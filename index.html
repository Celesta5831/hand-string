<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Draw</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: monospace; }
  #video {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; opacity: 0.25;
  }
  #drawCanvas {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #status {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.45);
    font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; z-index: 10;
    white-space: nowrap;
  }
  #hint {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.22);
    font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; z-index: 10;
    white-space: nowrap;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 16px 40px;
    font-size: 13px; letter-spacing: 4px;
    text-transform: uppercase; cursor: pointer;
    z-index: 20; border-radius: 40px;
  }
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="drawCanvas"></canvas>
<div id="status"></div>
<div id="hint"></div>
<button id="startBtn">TAP TO START</button>

<script>
const video = document.getElementById('video');
const drawCanvas = document.getElementById('drawCanvas');
const dctx = drawCanvas.getContext('2d');
const status = document.getElementById('status');
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');

drawCanvas.width = window.innerWidth;
drawCanvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  drawCanvas.width = window.innerWidth;
  drawCanvas.height = window.innerHeight;
});

// Smoothed positions
let smoothX = null, smoothY = null;
const SMOOTH = 0.35; // lower = smoother trails

// Stroke buffer — collect many points, redraw stroke smoothly
let currentStroke = []; // points in current stroke
let allStrokes = [];    // finished strokes

// Drag state
let isPinching = false;
let dragStartX = 0, dragStartY = 0;
let palmHeld = 0;

function dist(a, b, lm) {
  const dx = lm[a].x - lm[b].x;
  const dy = lm[a].y - lm[b].y;
  return Math.sqrt(dx*dx + dy*dy);
}

function isPinch(lm) { return dist(4, 8, lm) < 0.06; }

function isOpenPalm(lm) {
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  return tips.every((tip, i) => lm[tip].y < lm[pips[i]].y);
}

function setStatus(txt, timeout) {
  status.textContent = txt;
  if (timeout) setTimeout(() => { if(status.textContent === txt) status.textContent = ''; }, timeout);
}

// Draw a smooth catmull-rom spline through points
function drawStroke(pts, ctx) {
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  if (pts.length === 2) {
    ctx.lineTo(pts[1].x, pts[1].y);
  } else {
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i-1, 0)];
      const p1 = pts[i];
      const p2 = pts[i+1];
      const p3 = pts[Math.min(i+2, pts.length-1)];
      // Catmull-Rom to bezier
      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
    }
  }
  ctx.strokeStyle = '#00ffcc';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowBlur = 14;
  ctx.shadowColor = '#00ffcc';
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function redrawAll(offsetX, offsetY) {
  dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  if (offsetX !== undefined) {
    dctx.save();
    dctx.translate(offsetX, offsetY);
  }
  for (const stroke of allStrokes) drawStroke(stroke, dctx);
  if (currentStroke.length > 1) drawStroke(currentStroke, dctx);
  if (offsetX !== undefined) dctx.restore();
}

async function startCamera() {
  startBtn.style.display = 'none';
  status.textContent = 'Loading...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: 'user' } }, audio: false
    });
    video.srcObject = stream; await video.play(); loadMediaPipe();
  } catch(e) {
    try {
      const s2 = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = s2; await video.play(); loadMediaPipe();
    } catch(e2) { status.textContent = 'Camera error — refresh'; startBtn.style.display = 'block'; }
  }
}

function loadMediaPipe() {
  const s1 = document.createElement('script');
  s1.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js';
    s2.onload = initHands; s2.onerror = initHands;
    document.head.appendChild(s2);
  };
  s1.onerror = () => { status.textContent = 'Network error — refresh'; };
  document.head.appendChild(s1);
}

function initHands() {
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  hands.setOptions({
    maxNumHands: 1, modelComplexity: 0,
    minDetectionConfidence: 0.6, minTrackingConfidence: 0.6
  });

  hands.onResults(results => {
    if (!results.multiHandLandmarks?.length) {
      // Finger lifted — save current stroke
      if (currentStroke.length > 1) { allStrokes.push([...currentStroke]); }
      currentStroke = [];
      smoothX = null; smoothY = null;
      isPinching = false; palmHeld = 0;
      setStatus('Show your hand');
      hint.textContent = '';
      return;
    }

    const lm = results.multiHandLandmarks[0];
    const rawX = lm[8].x * drawCanvas.width;
    const rawY = lm[8].y * drawCanvas.height;
    // Palm position for drag (center of hand)
    const palmX = lm[0].x * drawCanvas.width;
    const palmY = lm[0].y * drawCanvas.height;

    if (smoothX === null) { smoothX = rawX; smoothY = rawY; }
    smoothX += (rawX - smoothX) * SMOOTH;
    smoothY += (rawY - smoothY) * SMOOTH;

    const palm = isOpenPalm(lm);
    const pinch = isPinch(lm);

    // Palm = clear
    if (palm) {
      if (currentStroke.length > 1) allStrokes.push([...currentStroke]);
      currentStroke = [];
      isPinching = false;
      palmHeld++;
      if (palmHeld === 4) {
        allStrokes = [];
        dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        setStatus('Cleared', 800);
      }
      hint.textContent = '🖐 clearing...';
      return;
    }
    palmHeld = 0;

    // Pinch = move/drag all strokes
    if (pinch) {
      if (currentStroke.length > 1) { allStrokes.push([...currentStroke]); currentStroke = []; }
      if (!isPinching) {
        isPinching = true;
        dragStartX = palmX; dragStartY = palmY;
        setStatus('Moving');
      } else {
        const dx = palmX - dragStartX;
        const dy = palmY - dragStartY;
        // Shift all stroke points
        for (const stroke of allStrokes) {
          for (const pt of stroke) { pt.x += dx; pt.y += dy; }
        }
        dragStartX = palmX; dragStartY = palmY;
        redrawAll();
      }
      hint.textContent = '🤏 moving';
      return;
    }

    isPinching = false;
    setStatus('');
    hint.textContent = '☝ draw  •  🤏 move  •  🖐 clear';

    // Add smoothed point to current stroke
    currentStroke.push({ x: smoothX, y: smoothY });

    // Redraw everything live
    redrawAll();
  });

  async function loop() {
    if (video.readyState >= 2) await hands.send({ image: video });
    setTimeout(loop, 55);
  }
  hands.initialize()
    .then(() => { setStatus('Show your hand'); loop(); })
    .catch(() => { setStatus('Show your hand'); loop(); });
}

startBtn.addEventListener('click', startCamera);
</script>
</body>
</html>
