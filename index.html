<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Draw</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: monospace; }
  #video {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; opacity: 0.25;
  }
  #drawCanvas {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #status {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.45);
    font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; z-index: 10;
    white-space: nowrap;
  }
  #hint {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; z-index: 10;
    white-space: nowrap;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 16px 40px;
    font-size: 13px; letter-spacing: 4px;
    text-transform: uppercase; cursor: pointer;
    z-index: 20; border-radius: 40px;
  }
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="drawCanvas"></canvas>
<div id="status"></div>
<div id="hint"></div>
<button id="startBtn">TAP TO START</button>

<script>
const video = document.getElementById('video');
const drawCanvas = document.getElementById('drawCanvas');
const dctx = drawCanvas.getContext('2d');
const status = document.getElementById('status');
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');

function resize() {
  drawCanvas.width = window.innerWidth;
  drawCanvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let lastPos = null;
let fistHeld = 0;
let cleared = false;

function isFist(lm) {
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  return tips.every((tip, i) => lm[tip].y > lm[pips[i]].y);
}

async function startCamera() {
  startBtn.style.display = 'none';
  status.textContent = 'Loading...';
  hint.textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: 'user' } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    loadMediaPipe();
  } catch(e) {
    // fallback to any camera
    try {
      const stream2 = await navigator.mediaDevices.getUserMedia({
        video: true, audio: false
      });
      video.srcObject = stream2;
      await video.play();
      loadMediaPipe();
    } catch(e2) {
      status.textContent = 'Camera error — refresh';
      startBtn.style.display = 'block';
    }
  }
}

function loadMediaPipe() {
  const s1 = document.createElement('script');
  s1.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js';
    s2.onload = initHands; s2.onerror = initHands;
    document.head.appendChild(s2);
  };
  s1.onerror = () => { status.textContent = 'Network error — refresh'; };
  document.head.appendChild(s1);
}

function initHands() {
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  hands.setOptions({
    maxNumHands: 1, modelComplexity: 0,
    minDetectionConfidence: 0.6, minTrackingConfidence: 0.6
  });

  hands.onResults(results => {
    if (results.multiHandLandmarks?.length > 0) {
      const lm = results.multiHandLandmarks[0];

      if (isFist(lm)) {
        fistHeld++;
        lastPos = null;
        if (fistHeld === 4) {
          dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          status.textContent = 'Cleared';
          setTimeout(() => { status.textContent = ''; }, 800);
        }
        return;
      }

      fistHeld = 0;
      status.textContent = '';
      hint.textContent = '☝ draw  •  ✊ clear';

      const x = lm[8].x * drawCanvas.width;
      const y = lm[8].y * drawCanvas.height;

      if (lastPos) {
        dctx.beginPath();
        dctx.moveTo(lastPos.x, lastPos.y);
        dctx.lineTo(x, y);
        dctx.strokeStyle = '#00ffcc';
        dctx.lineWidth = 3.5;
        dctx.lineCap = 'round';
        dctx.lineJoin = 'round';
        dctx.shadowBlur = 16;
        dctx.shadowColor = '#00ffcc';
        dctx.stroke();
        dctx.shadowBlur = 0;
      }
      lastPos = { x, y };

    } else {
      lastPos = null;
      fistHeld = 0;
      status.textContent = 'Show your hand';
      hint.textContent = '';
    }
  });

  async function loop() {
    if (video.readyState >= 2) await hands.send({ image: video });
    setTimeout(loop, 80);
  }
  hands.initialize()
    .then(() => { status.textContent = 'Show your hand'; loop(); })
    .catch(() => { status.textContent = 'Show your hand'; loop(); });
}

startBtn.addEventListener('click', startCamera);
</script>
</body>
</html>
