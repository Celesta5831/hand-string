<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hand String</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: monospace; }
  #video {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; opacity: 0.3;
  }
  #drawCanvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #canvas {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #status {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; z-index: 10;
    white-space: nowrap; transition: opacity 0.5s;
  }
  #gesture {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%);
    color: #fff; font-size: 22px;
    z-index: 10; opacity: 0;
    transition: opacity 0.3s;
    text-align: center;
    letter-spacing: 2px;
  }
  #colorDot {
    position: fixed; top: 20px; right: 20px;
    width: 18px; height: 18px;
    border-radius: 50%; z-index: 10;
    box-shadow: 0 0 12px currentColor;
    transition: background 0.3s;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 16px 40px;
    font-size: 13px; letter-spacing: 4px;
    text-transform: uppercase; cursor: pointer;
    z-index: 20; border-radius: 40px;
    backdrop-filter: blur(10px);
  }
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="drawCanvas"></canvas>
<canvas id="canvas"></canvas>
<div id="status"></div>
<div id="gesture"></div>
<div id="colorDot"></div>
<button id="startBtn">TAP TO START</button>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const drawCanvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const dctx = drawCanvas.getContext('2d');
const status = document.getElementById('status');
const gestureEl = document.getElementById('gesture');
const colorDot = document.getElementById('colorDot');
const startBtn = document.getElementById('startBtn');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawCanvas.width = window.innerWidth;
  drawCanvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const FINGERTIPS = [4, 8, 12, 16, 20];
const THEMES = [
  ['#f5c842', '#f76b8a', '#43e8b0', '#4db8ff', '#b388ff'],
  ['#ff6b6b', '#ffa07a', '#ffd700', '#98fb98', '#87ceeb'],
  ['#ff00ff', '#00ffff', '#ffffff', '#ff69b4', '#7fff00'],
  ['#ff4500', '#ff8c00', '#ffd700', '#adff2f', '#00fa9a'],
  ['#6a0dad', '#9400d3', '#4b0082', '#0000ff', '#00bfff'],
];
let themeIdx = 0;
let COLORS = THEMES[themeIdx];

let handVisible = false;
let drawing = true; // drawing mode on by default
let paused = false;
let lastPositions = Array(5).fill(null);
let gestureTimeout = null;
let lastGesture = '';
let gestureHoldFrames = 0;

class Node {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.tx = x; this.ty = y;
    this.color = color;
  }
  update() {
    this.x += (this.tx - this.x) * 0.22;
    this.y += (this.ty - this.y) * 0.22;
  }
}

let nodes = COLORS.map((c, i) => new Node(
  canvas.width/2 + (i-2)*60, canvas.height/2, c
));

function showGesture(text) {
  gestureEl.textContent = text;
  gestureEl.style.opacity = '1';
  clearTimeout(gestureTimeout);
  gestureTimeout = setTimeout(() => {
    gestureEl.style.opacity = '0';
  }, 1200);
}

function updateColorDot() {
  colorDot.style.background = COLORS[1];
  colorDot.style.boxShadow = `0 0 12px ${COLORS[1]}`;
}
updateColorDot();

// Gesture detection helpers
function dist(a, b, lm) {
  const dx = lm[a].x - lm[b].x;
  const dy = lm[a].y - lm[b].y;
  return Math.sqrt(dx*dx + dy*dy);
}

function isFist(lm) {
  // All fingertips below their pip joints
  const tips = [8,12,16,20];
  const pips = [6,10,14,18];
  return tips.every((tip, i) => lm[tip].y > lm[pips[i]].y);
}

function isPinch(lm) {
  return dist(4, 8, lm) < 0.07;
}

function isOpenPalm(lm) {
  const tips = [8,12,16,20];
  const pips = [6,10,14,18];
  return tips.every((tip, i) => lm[tip].y < lm[pips[i]].y);
}

function detectGesture(lm) {
  if (isFist(lm)) return 'fist';
  if (isPinch(lm)) return 'pinch';
  if (isOpenPalm(lm)) return 'palm';
  return 'none';
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  nodes.forEach(n => n.update());

  if (handVisible) {
    // Draw strings
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        grad.addColorStop(0, a.color + '66');
        grad.addColorStop(1, b.color + '66');

        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 9;
        ctx.shadowBlur = 18; ctx.shadowColor = a.color;
        ctx.stroke();

        const grad2 = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        grad2.addColorStop(0, a.color);
        grad2.addColorStop(1, b.color);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = grad2;
        ctx.lineWidth = 1.2;
        ctx.shadowBlur = 4; ctx.shadowColor = '#fff';
        ctx.stroke();
      }
    }

    // Draw dots
    nodes.forEach(n => {
      ctx.beginPath(); ctx.arc(n.x, n.y, 7, 0, Math.PI*2);
      ctx.fillStyle = n.color;
      ctx.shadowBlur = 20; ctx.shadowColor = n.color;
      ctx.fill();
      ctx.beginPath(); ctx.arc(n.x, n.y, 2.5, 0, Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 6; ctx.shadowColor = '#fff';
      ctx.fill();
    });
  }

  ctx.shadowBlur = 0;
  requestAnimationFrame(draw);
}

function drawTrails(newPositions) {
  if (paused) return;
  // Draw trail from index fingertip (node 1) only for clean drawing
  const idx = 1; // index finger
  const prev = lastPositions[idx];
  const curr = newPositions[idx];
  if (prev && curr) {
    dctx.beginPath();
    dctx.moveTo(prev.x, prev.y);
    dctx.lineTo(curr.x, curr.y);
    const grad = dctx.createLinearGradient(prev.x, prev.y, curr.x, curr.y);
    grad.addColorStop(0, COLORS[idx] + 'cc');
    grad.addColorStop(1, COLORS[idx] + 'cc');
    dctx.strokeStyle = grad;
    dctx.lineWidth = 3;
    dctx.lineCap = 'round';
    dctx.shadowBlur = 12; dctx.shadowColor = COLORS[idx];
    dctx.stroke();
    dctx.shadowBlur = 0;
  }
  lastPositions = newPositions;
}

async function startCamera() {
  startBtn.style.display = 'none';
  status.textContent = 'Loading...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    draw();
    loadMediaPipe();
  } catch(e) {
    status.textContent = 'Camera error — tap to retry';
    startBtn.style.display = 'block';
  }
}

function loadMediaPipe() {
  const s1 = document.createElement('script');
  s1.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js';
    s2.onload = initHands; s2.onerror = initHands;
    document.head.appendChild(s2);
  };
  s1.onerror = () => { status.textContent = 'Network error — refresh'; };
  document.head.appendChild(s1);
}

function initHands() {
  status.textContent = 'Show your hand';
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  hands.setOptions({
    maxNumHands: 1, modelComplexity: 0,
    minDetectionConfidence: 0.55, minTrackingConfidence: 0.55
  });

  hands.onResults(results => {
    if (results.multiHandLandmarks?.length > 0) {
      handVisible = true;
      status.textContent = '';
      const lm = results.multiHandLandmarks[0];

      // Update node targets
      const newPositions = FINGERTIPS.map((tip, i) => {
        const x = lm[tip].x * canvas.width;
        const y = lm[tip].y * canvas.height;
        nodes[i].tx = x; nodes[i].ty = y;
        return { x, y };
      });

      // Draw trails
      drawTrails(newPositions);

      // Gesture detection with hold
      const g = detectGesture(lm);
      if (g === lastGesture) {
        gestureHoldFrames++;
      } else {
        gestureHoldFrames = 0;
        lastGesture = g;
      }

      if (gestureHoldFrames === 5) { // held for ~5 frames
        if (g === 'fist') {
          dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          showGesture('✊  Cleared!');
        } else if (g === 'pinch') {
          themeIdx = (themeIdx + 1) % THEMES.length;
          COLORS = THEMES[themeIdx];
          nodes.forEach((n, i) => n.color = COLORS[i]);
          updateColorDot();
          showGesture('🤏  Color changed!');
        } else if (g === 'palm') {
          paused = !paused;
          showGesture(paused ? '🖐  Paused' : '🖐  Drawing');
        }
      }

    } else {
      handVisible = false;
      lastPositions = Array(5).fill(null);
      status.textContent = 'Show your hand';
    }
  });

  async function loop() {
    if (video.readyState >= 2) await hands.send({ image: video });
    setTimeout(loop, 80);
  }
  hands.initialize().then(() => { status.textContent = 'Show your hand'; loop(); })
    .catch(() => { status.textContent = 'Show your hand'; loop(); });
}

startBtn.addEventListener('click', startCamera);
</script>
</body>
</html>
