<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hand String</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: monospace; }
  #video {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; opacity: 0.35;
  }
  #drawCanvas {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #canvas {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #status {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; z-index: 10;
    white-space: nowrap;
  }
  #clearBtn {
    position: fixed; bottom: 30px; right: 24px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; padding: 10px 22px;
    font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; cursor: pointer;
    z-index: 20; border-radius: 30px;
    display: none;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 16px 40px;
    font-size: 13px; letter-spacing: 4px;
    text-transform: uppercase; cursor: pointer;
    z-index: 20; border-radius: 40px;
  }
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="drawCanvas"></canvas>
<canvas id="canvas"></canvas>
<div id="status"></div>
<button id="clearBtn">CLEAR</button>
<button id="startBtn">TAP TO START</button>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const drawCanvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const dctx = drawCanvas.getContext('2d');
const status = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const clearBtn = document.getElementById('clearBtn');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawCanvas.width = window.innerWidth;
  drawCanvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const FINGERTIPS = [4, 8, 12, 16, 20];
const COLORS = ['#ff003c', '#ff6600', '#00ffcc', '#0088ff', '#cc00ff'];

let handVisible = false;
let lastPos = null;

class Node {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.tx = x; this.ty = y;
    this.color = color;
  }
  update() {
    this.x += (this.tx - this.x) * 0.2;
    this.y += (this.ty - this.y) * 0.2;
  }
}

let nodes = COLORS.map((c, i) => new Node(
  canvas.width/2 + (i-2)*60, canvas.height/2, c
));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  nodes.forEach(n => n.update());

  if (handVisible) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        grad.addColorStop(0, a.color + '55');
        grad.addColorStop(1, b.color + '55');
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 10;
        ctx.shadowBlur = 20; ctx.shadowColor = a.color;
        ctx.stroke();

        const grad2 = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        grad2.addColorStop(0, a.color);
        grad2.addColorStop(1, b.color);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = grad2;
        ctx.lineWidth = 1.2;
        ctx.shadowBlur = 6; ctx.shadowColor = '#fff';
        ctx.stroke();
      }
    }

    nodes.forEach(n => {
      ctx.beginPath(); ctx.arc(n.x, n.y, 7, 0, Math.PI*2);
      ctx.fillStyle = n.color;
      ctx.shadowBlur = 22; ctx.shadowColor = n.color;
      ctx.fill();
      ctx.beginPath(); ctx.arc(n.x, n.y, 2.5, 0, Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 6; ctx.shadowColor = '#fff';
      ctx.fill();
    });
  }

  ctx.shadowBlur = 0;
  requestAnimationFrame(draw);
}

function drawTrail(curr) {
  if (lastPos && curr) {
    dctx.beginPath();
    dctx.moveTo(lastPos.x, lastPos.y);
    dctx.lineTo(curr.x, curr.y);
    dctx.strokeStyle = '#00ffcc';
    dctx.lineWidth = 3;
    dctx.lineCap = 'round';
    dctx.lineJoin = 'round';
    dctx.shadowBlur = 14;
    dctx.shadowColor = '#00ffcc';
    dctx.stroke();
    dctx.shadowBlur = 0;
  }
  lastPos = curr;
}

async function startCamera() {
  startBtn.style.display = 'none';
  status.textContent = 'Loading...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: 'user' } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    draw();
    loadMediaPipe();
    clearBtn.style.display = 'block';
  } catch(e) {
    status.textContent = 'Camera error — tap to retry';
    startBtn.style.display = 'block';
  }
}

function loadMediaPipe() {
  const s1 = document.createElement('script');
  s1.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js';
    s2.onload = initHands; s2.onerror = initHands;
    document.head.appendChild(s2);
  };
  s1.onerror = () => { status.textContent = 'Network error — refresh'; };
  document.head.appendChild(s1);
}

function initHands() {
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  hands.setOptions({
    maxNumHands: 1, modelComplexity: 0,
    minDetectionConfidence: 0.55, minTrackingConfidence: 0.55
  });
  hands.onResults(results => {
    if (results.multiHandLandmarks?.length > 0) {
      handVisible = true;
      status.textContent = '';
      const lm = results.multiHandLandmarks[0];
      FINGERTIPS.forEach((tip, i) => {
        nodes[i].tx = lm[tip].x * canvas.width;
        nodes[i].ty = lm[tip].y * canvas.height;
      });
      // Draw with index fingertip (landmark 8)
      const ix = lm[8].x * canvas.width;
      const iy = lm[8].y * canvas.height;
      drawTrail({ x: ix, y: iy });
    } else {
      handVisible = false;
      lastPos = null;
      status.textContent = 'Show your hand';
    }
  });

  async function loop() {
    if (video.readyState >= 2) await hands.send({ image: video });
    setTimeout(loop, 80);
  }
  hands.initialize()
    .then(() => { status.textContent = 'Show your hand'; loop(); })
    .catch(() => { status.textContent = 'Show your hand'; loop(); });
}

clearBtn.addEventListener('click', () => {
  dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
});
startBtn.addEventListener('click', startCamera);
</script>
</body>
</html>
