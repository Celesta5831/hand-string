<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Draw</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: monospace; }
  #video {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; opacity: 0.25;
  }
  #drawCanvas {
    transform: scaleX(-1);
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #status {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.45);
    font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; z-index: 10;
    white-space: nowrap; transition: opacity 0.3s;
  }
  #hint {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.25);
    font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; z-index: 10;
    white-space: nowrap;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 16px 40px;
    font-size: 13px; letter-spacing: 4px;
    text-transform: uppercase; cursor: pointer;
    z-index: 20; border-radius: 40px;
  }
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="drawCanvas"></canvas>
<div id="status"></div>
<div id="hint"></div>
<button id="startBtn">TAP TO START</button>

<script>
const video = document.getElementById('video');
const drawCanvas = document.getElementById('drawCanvas');
const dctx = drawCanvas.getContext('2d');
const status = document.getElementById('status');
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');

function resize() {
  // Save drawing before resize
  const img = drawCanvas.toDataURL();
  drawCanvas.width = window.innerWidth;
  drawCanvas.height = window.innerHeight;
  const i = new Image(); i.onload = () => dctx.drawImage(i, 0, 0);
  i.src = img;
}
drawCanvas.width = window.innerWidth;
drawCanvas.height = window.innerHeight;
window.addEventListener('resize', resize);

// Smoothed finger position
let smoothX = null, smoothY = null;
const SMOOTH = 0.5; // lerp factor — higher = more responsive, lower = smoother

// Points buffer for bezier curves
let pts = [];

// Drag state
let isDragging = false;
let dragOffsetX = 0, dragOffsetY = 0;
let fistHeld = 0, palmHeld = 0;

function isOpenPalm(lm) {
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  return tips.every((tip, i) => lm[tip].y < lm[pips[i]].y);
}

function isFist(lm) {
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  return tips.every((tip, i) => lm[tip].y > lm[pips[i]].y);
}

function setStatus(txt, timeout) {
  status.textContent = txt;
  if (timeout) setTimeout(() => status.textContent = '', timeout);
}

function drawSmoothCurve() {
  if (pts.length < 3) return;
  dctx.beginPath();
  dctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 2; i++) {
    const cx = (pts[i].x + pts[i+1].x) / 2;
    const cy = (pts[i].y + pts[i+1].y) / 2;
    dctx.quadraticCurveTo(pts[i].x, pts[i].y, cx, cy);
  }
  const last = pts.length - 1;
  dctx.quadraticCurveTo(pts[last-1].x, pts[last-1].y, pts[last].x, pts[last].y);
  dctx.strokeStyle = '#00ffcc';
  dctx.lineWidth = 3;
  dctx.lineCap = 'round';
  dctx.lineJoin = 'round';
  dctx.shadowBlur = 14;
  dctx.shadowColor = '#00ffcc';
  dctx.stroke();
  dctx.shadowBlur = 0;
  // Keep only last point to continue curve
  pts = [pts[last]];
}

async function startCamera() {
  startBtn.style.display = 'none';
  status.textContent = 'Loading...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: 'user' } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    loadMediaPipe();
  } catch(e) {
    try {
      const stream2 = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = stream2;
      await video.play();
      loadMediaPipe();
    } catch(e2) {
      status.textContent = 'Camera error — refresh';
      startBtn.style.display = 'block';
    }
  }
}

function loadMediaPipe() {
  const s1 = document.createElement('script');
  s1.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js';
    s2.onload = initHands; s2.onerror = initHands;
    document.head.appendChild(s2);
  };
  s1.onerror = () => { status.textContent = 'Network error — refresh'; };
  document.head.appendChild(s1);
}

function initHands() {
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  hands.setOptions({
    maxNumHands: 1, modelComplexity: 0,
    minDetectionConfidence: 0.6, minTrackingConfidence: 0.6
  });

  hands.onResults(results => {
    if (!results.multiHandLandmarks?.length) {
      pts = [];
      smoothX = null; smoothY = null;
      isDragging = false;
      fistHeld = 0; palmHeld = 0;
      setStatus('Show your hand');
      hint.textContent = '';
      return;
    }

    const lm = results.multiHandLandmarks[0];
    const rawX = lm[8].x * drawCanvas.width;
    const rawY = lm[8].y * drawCanvas.height;

    // Smooth finger position
    if (smoothX === null) { smoothX = rawX; smoothY = rawY; }
    smoothX += (rawX - smoothX) * SMOOTH;
    smoothY += (rawY - smoothY) * SMOOTH;

    // Detect gestures
    const fist = isFist(lm);
    const palm = isOpenPalm(lm);

    // Palm = clear
    if (palm) {
      pts = [];
      palmHeld++;
      fistHeld = 0;
      isDragging = false;
      if (palmHeld === 4) {
        dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        setStatus('Cleared', 800);
      }
      hint.textContent = '🖐 clearing...';
      return;
    }

    // Fist = drag/move drawing
    if (fist) {
      pts = [];
      fistHeld++;
      palmHeld = 0;

      if (fistHeld === 3) {
        isDragging = true;
        dragOffsetX = smoothX;
        dragOffsetY = smoothY;
        setStatus('Moving', 0);
      }

      if (isDragging && fistHeld > 3) {
        const dx = smoothX - dragOffsetX;
        const dy = smoothY - dragOffsetY;
        // Move canvas content
        const img = dctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
        dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        dctx.putImageData(img, dx, dy);
        dragOffsetX = smoothX;
        dragOffsetY = smoothY;
      }
      hint.textContent = '✊ moving';
      return;
    }

    // Drawing mode
    fistHeld = 0; palmHeld = 0; isDragging = false;
    setStatus('');
    hint.textContent = '☝ draw  •  ✊ move  •  🖐 clear';

    pts.push({ x: smoothX, y: smoothY });
    if (pts.length >= 4) drawSmoothCurve();
  });

  async function loop() {
    if (video.readyState >= 2) await hands.send({ image: video });
    setTimeout(loop, 60); // slightly faster = smoother
  }
  hands.initialize()
    .then(() => { setStatus('Show your hand'); loop(); })
    .catch(() => { setStatus('Show your hand'); loop(); });
}

startBtn.addEventListener('click', startCamera);
</script>
</body>
</html>
