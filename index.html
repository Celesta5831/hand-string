<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hand String</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: monospace; }
  #video {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; opacity: 0.4;
  }
  #canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #status {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%);
    color: #0ff; font-size: 13px;
    letter-spacing: 2px; text-transform: uppercase;
    z-index: 10; text-shadow: 0 0 10px #0ff;
    white-space: nowrap;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: transparent; border: 1px solid #0ff;
    color: #0ff; padding: 14px 32px;
    font-size: 14px; letter-spacing: 3px;
    text-transform: uppercase; cursor: pointer;
    z-index: 20; box-shadow: 0 0 20px #0ff4;
  }
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="canvas"></canvas>
<div id="status">TAP START</div>
<button id="startBtn">START</button>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

const FINGERTIPS = [4, 8, 12, 16, 20];
const COLORS = ['#ff003c','#ff6600','#00ffcc','#0088ff','#cc00ff'];

class Node {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.tx = x; this.ty = y;
    this.vx = 0; this.vy = 0;
    this.color = color;
  }
  update() {
    let ax = (this.tx - this.x) * 0.18;
    let ay = (this.ty - this.y) * 0.18;
    this.vx = (this.vx + ax) * 0.75;
    this.vy = (this.vy + ay) * 0.75;
    this.x += this.vx; this.y += this.vy;
  }
}

let nodes = COLORS.map((c, i) => new Node(
  canvas.width/2 + (i-2)*60, canvas.height/2, c
));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  nodes.forEach(n => n.update());

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i+1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = a.color + '44';
      ctx.lineWidth = 8;
      ctx.shadowBlur = 25; ctx.shadowColor = a.color;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 5; ctx.shadowColor = '#fff';
      ctx.stroke();
    }
  }

  nodes.forEach(n => {
    ctx.beginPath(); ctx.arc(n.x, n.y, 8, 0, Math.PI*2);
    ctx.fillStyle = n.color; ctx.shadowBlur = 20;
    ctx.shadowColor = n.color; ctx.fill();
    ctx.beginPath(); ctx.arc(n.x, n.y, 3, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 8;
    ctx.shadowColor = '#fff'; ctx.fill();
  });

  ctx.shadowBlur = 0;
  requestAnimationFrame(draw);
}

async function startCamera() {
  startBtn.style.display = 'none';
  status.textContent = 'Starting camera...';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    status.textContent = 'Loading model...';
    draw();
    loadMediaPipe();
  } catch(e) {
    status.textContent = 'Camera error!';
    startBtn.style.display = 'block';
  }
}

function loadMediaPipe() {
  // Load scripts sequentially
  const s1 = document.createElement('script');
  s1.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js';
    s2.onload = initHands;
    s2.onerror = () => initHands(); // try anyway
    document.head.appendChild(s2);
  };
  s1.onerror = () => { status.textContent = 'CDN error - try refresh'; };
  document.head.appendChild(s1);
}

function initHands() {
  status.textContent = 'Initializing...';
  try {
    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(results => {
      if (results.multiHandLandmarks?.length > 0) {
        status.textContent = '✦ TRACKING';
        const lm = results.multiHandLandmarks[0];
        FINGERTIPS.forEach((tip, i) => {
          // flip X because video is NOT mirrored
          nodes[i].tx = lm[tip].x * canvas.width;
          nodes[i].ty = lm[tip].y * canvas.height;
        });
      } else {
        status.textContent = 'SHOW YOUR HAND';
      }
    });

    async function loop() {
      if (video.readyState >= 2) {
        await hands.send({ image: video });
      }
      setTimeout(loop, 100); // ~10fps, easier on mobile
    }

    hands.initialize().then(() => {
      status.textContent = 'SHOW YOUR HAND';
      loop();
    }).catch(() => {
      status.textContent = 'SHOW YOUR HAND';
      loop();
    });

  } catch(e) {
    status.textContent = 'Error: ' + e.message;
  }
}

startBtn.addEventListener('click', startCamera);
</script>
</body>
</html>
